{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Edit Doctor</h1>
    <p>Update doctor information.</p>
</div>

{% if message %}
<div class="message {{ message_type }}">
    {{ message }}
</div>
{% endif %}

<section class="panel edit-panel">
    <form method="POST"
          action="{{ url_for('edit_doctor_page', doctor_id=doctor.doctor_id) }}">

        <label for="full_name">Doctor Name *</label>
        <input
            id="full_name"
            name="full_name"
            type="text"
            maxlength="100"
            value="{{ doctor.full_name or '' }}"
            required
        >

        <label for="specialization">Specialization *</label>
        <input
            id="specialization"
            name="specialization"
            type="text"
            maxlength="100"
            value="{{ doctor.specialization or '' }}"
            required
        >

        <label for="phone">Phone</label>
        <input
            id="phone"
            name="phone"
            type="tel"
            maxlength="15"
            value="{{ doctor.phone or '' }}"
        >

        <label for="email">Email</label>
        <input
            id="email"
            name="email"
            type="email"
            maxlength="100"
            value="{{ doctor.email or '' }}"
        >

        <label for="consultation_fee">Consultation Fee (₹)</label>
        <input
            id="consultation_fee"
            name="consultation_fee"
            type="number"
            min="0"
            step="0.01"
            value="{{ doctor.consultation_fee if doctor.consultation_fee is not none else 0 }}"
        >

        <label for="available">Availability</label>
        <select id="available" name="available">
            <option value="true"
                {% if doctor.available %}selected{% endif %}>
                Available
            </option>
            <option value="false"
                {% if not doctor.available %}selected{% endif %}>
                Unavailable
            </option>
        </select>

        <button type="submit" class="primary-btn">
            Save Changes
        </button>

        <a class="cancel-link" href="{{ url_for('doctors_page') }}">
            Cancel
        </a>
    </form>
</section>

{% endblock %}
```
